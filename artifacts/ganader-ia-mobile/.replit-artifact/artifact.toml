kind = "mobile"
previewPath = "/mobile/"
title = "GanaderIA Mobile"
description = "Aplicación móvil para clientes y personal CIVAC: acceso seguro, resumen de finca, animales, pesajes, potreros y asistente IA conectado al backend Flask de GanaderIA."
version = "1.0.0"
id = "artifacts/ganader-ia-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 20585

[services.development]
run = "pnpm --filter @workspace/ganader-ia-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ganader-ia-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/ganader-ia-mobile", "run", "serve" ]

[services.env]
PORT = "20585"
BASE_PATH = "/mobile/"
