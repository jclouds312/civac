<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#003d2e"/>
      <stop offset="100%" stop-color="#001a14"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#00c896"/>
      <stop offset="100%" stop-color="#00a070"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#39ff7e"/>
      <stop offset="100%" stop-color="#00c850"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)"/>
  <rect width="100" height="100" rx="22" fill="none" stroke="#00f5d4" stroke-width="2" opacity="0.6"/>
  <ellipse cx="38" cy="24" rx="5" ry="14" fill="url(#leafGrad)" transform="rotate(-25 38 24)" filter="url(#glow)" opacity="0.95"/>
