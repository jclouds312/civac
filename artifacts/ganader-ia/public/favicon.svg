<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="180" height="180" rx="40" fill="url(#bgGrad)"/>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f2d1a"/>
      <stop offset="100%" stop-color="#1a4a2e"/>
    </linearGradient>
    <linearGradient id="cowGrad" x1="48" y1="60" x2="132" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="hornGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Circuit lines background -->
  <line x1="20" y1="30" x2="55" y2="30" stroke="#4ade80" stroke-width="0.8" opacity="0.25"/>
  <line x1="55" y1="30" x2="55" y2="52" stroke="#4ade80" stroke-width="0.8" opacity="0.25"/>
  <line x1="125" y1="30" x2="160" y2="30" stroke="#4ade80" stroke-width="0.8" opacity="0.25"/>
  <line x1="125" y1="30" x2="125" y2="52" stroke="#4ade80" stroke-width="0.8" opacity="0.25"/>
  <circle cx="20" cy="30" r="2.5" fill="#4ade80" opacity="0.4"/>
  <circle cx="160" cy="30" r="2.5" fill="#4ade80" opacity="0.4"/>
  <line x1="20" y1="148" x2="55" y2="148" stroke="#4ade80" stroke-width="0.8" opacity="0.2"/>
  <line x1="125" y1="148" x2="160" y2="148" stroke="#4ade80" stroke-width="0.8" opacity="0.2"/>
  <circle cx="20" cy="148" r="2" fill="#4ade80" opacity="0.3"/>
  <circle cx="160" cy="148" r="2" fill="#4ade80" opacity="0.3"/>

  <!-- Left horn -->
  <path d="M58 82 Q44 56 52 44 Q62 58 68 78" fill="url(#hornGrad)" opacity="0.9"/>
  <!-- Right horn -->
  <path d="M122 82 Q136 56 128 44 Q118 58 112 78" fill="url(#hornGrad)" opacity="0.9"/>

  <!-- Left ear -->
  <ellipse cx="52" cy="88" rx="12" ry="8" fill="#2d8a4e" transform="rotate(-25 52 88)"/>
  <ellipse cx="52" cy="88" rx="7" ry="4.5" fill="#1a5c2e" transform="rotate(-25 52 88)"/>
  <!-- Right ear -->
  <ellipse cx="128" cy="88" rx="12" ry="8" fill="#2d8a4e" transform="rotate(25 128 88)"/>
  <ellipse cx="128" cy="88" rx="7" ry="4.5" fill="#1a5c2e" transform="rotate(25 128 88)"/>

  <!-- Cow head -->
  <ellipse cx="90" cy="100" rx="43" ry="38" fill="url(#cowGrad)"/>

  <!-- Eyes white -->
  <circle cx="75" cy="93" r="9" fill="white"/>
  <circle cx="105" cy="93" r="9" fill="white"/>
  <!-- Iris -->
  <circle cx="76" cy="93" r="5" fill="#0f2d1a"/>
  <circle cx="106" cy="93" r="5" fill="#0f2d1a"/>
  <!-- Eye shine -->
  <circle cx="78" cy="91" r="1.8" fill="white"/>
  <circle cx="108" cy="91" r="1.8" fill="white"/>
  <!-- Pupil dot -->
  <circle cx="76.5" cy="93.5" r="2.5" fill="#071810"/>
  <circle cx="106.5" cy="93.5" r="2.5" fill="#071810"/>

  <!-- Muzzle -->
  <ellipse cx="90" cy="118" rx="23" ry="15" fill="#1a5c2e"/>
  <!-- Nostrils -->
  <ellipse cx="82" cy="118" r="4.5" fill="#0f3322"/>
  <ellipse cx="98" cy="118" r="4.5" fill="#0f3322"/>
  <!-- Nostril shine -->
  <circle cx="83.5" cy="116.5" r="1" fill="#2d8a4e" opacity="0.5"/>
  <circle cx="99.5" cy="116.5" r="1" fill="#2d8a4e" opacity="0.5"/>

  <!-- AI nodes — top area -->
  <circle cx="90" cy="34" r="4" fill="#4ade80" filter="url(#glow)" opacity="0.9"/>
  <circle cx="72" cy="42" r="2.5" fill="#4ade80" opacity="0.7"/>
  <circle cx="108" cy="42" r="2.5" fill="#4ade80" opacity="0.7"/>
  <line x1="90" y1="34" x2="72" y2="42" stroke="#4ade80" stroke-width="1.2" opacity="0.5"/>
  <line x1="90" y1="34" x2="108" y2="42" stroke="#4ade80" stroke-width="1.2" opacity="0.5"/>
  <line x1="72" y1="42" x2="72" y2="56" stroke="#4ade80" stroke-width="1" opacity="0.3"/>
  <line x1="108" y1="42" x2="108" y2="56" stroke="#4ade80" stroke-width="1" opacity="0.3"/>
</svg>
