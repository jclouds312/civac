  <ellipse cx="62" cy="24" rx="5" ry="14" fill="url(#leafGrad)" transform="rotate(25 62 24)" filter="url(#glow)" opacity="0.95"/>
  <ellipse cx="50" cy="63" rx="22" ry="28" fill="url(#bodyGrad)" filter="url(#glow)"/>
  <g opacity="0.25" stroke="#001a14" stroke-width="1.2" fill="none">
    <line x1="35" y1="42" x2="65" y2="84"/>
    <line x1="42" y1="38" x2="72" y2="80"/>
    <line x1="28" y1="55" x2="72" y2="55"/>
    <line x1="30" y1="65" x2="70" y2="65"/>
    <line x1="33" y1="75" x2="67" y2="75"/>
