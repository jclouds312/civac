<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e3a20"/>
      <stop offset="100%" stop-color="#082818"/>
    </linearGradient>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#f0ede0"/>
      <stop offset="100%" stop-color="#ccc4a8"/>
    </linearGradient>
    <linearGradient id="hornG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5d878"/>
      <stop offset="100%" stop-color="#c8a030"/>
    </linearGradient>
    <linearGradient id="chipG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#00a8e8"/>
    </linearGradient>
    <linearGradient id="borderG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00c8ff" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="100" height="100" rx="22" fill="url(#bgG)"/>
  <rect width="100" height="100" rx="22" fill="none" stroke="url(#borderG)" stroke-width="2"/>

  <!-- Cuernos -->
  <path d="M32 40 C26 32 20 22 23 12 C25.5 4 32.5 7 33.5 16 C32 23 32 33 34 39" fill="url(#hornG)" filter="url(#shadow)"/>
  <path d="M68 40 C74 32 80 22 77 12 C74.5 4 67.5 7 66.5 16 C68 23 68 33 66 39" fill="url(#hornG)" filter="url(#shadow)"/>

  <!-- Orejas -->
  <ellipse cx="22" cy="48" rx="10" ry="7" fill="#ddd4b8" transform="rotate(-20 22 48)"/>
  <ellipse cx="22" cy="48" rx="5.5" ry="4" fill="#e8c0a0" transform="rotate(-20 22 48)"/>
  <ellipse cx="78" cy="48" rx="10" ry="7" fill="#ddd4b8" transform="rotate(20 78 48)"/>
  <ellipse cx="78" cy="48" rx="5.5" ry="4" fill="#e8c0a0" transform="rotate(20 78 48)"/>

  <!-- Cuerpo/Cabeza -->
  <ellipse cx="50" cy="68" rx="30" ry="26" fill="url(#bodyG)" filter="url(#shadow)"/>
  <ellipse cx="50" cy="52" rx="25" ry="21" fill="#f0ede0"/>

  <!-- Manchas -->
  <path d="M35 42 C32 37 29 42 31 47 C33 51 39 50 41 45 C43 40 38 39 35 42Z" fill="#3a2818" opacity="0.7"/>
  <path d="M62 45 C59 41 56 43 57 49 C58 53 63 52 65 47 C67 43 65 41 62 45Z" fill="#3a2818" opacity="0.6"/>

  <!-- Chip IA -->
  <rect x="44" y="22" width="12" height="12" rx="3" fill="url(#chipG)" opacity="0.95" filter="url(#glow)"/>
  <rect x="47" y="25" width="6" height="6" rx="1.5" fill="#071a2f" opacity="0.95"/>
  <line x1="47.5" y1="22" x2="47.5" y2="20" stroke="#00f5d4" stroke-width="1" opacity="0.6"/>
  <line x1="52.5" y1="22" x2="52.5" y2="20" stroke="#00f5d4" stroke-width="1" opacity="0.6"/>
  <!-- Circuito -->
  <path d="M36 36 L40 36 L43 32.5 L57 32.5 L60 36 L64 36" stroke="#00f5d4" stroke-width="1.2" fill="none" opacity="0.75" filter="url(#glow)"/>
  <circle cx="40" cy="36" r="1.8" fill="#00f5d4" opacity="0.9" filter="url(#glow)"/>
  <circle cx="60" cy="36" r="1.8" fill="#00f5d4" opacity="0.9" filter="url(#glow)"/>

  <!-- Ojos -->
  <ellipse cx="37" cy="54" rx="8" ry="7.5" fill="#1a1008"/>
  <ellipse cx="37" cy="54" rx="6" ry="5.5" fill="#3a2010"/>
  <circle cx="37" cy="54" r="3.2" fill="#0e0804"/>
  <circle cx="39" cy="51.5" r="1.8" fill="white" opacity="0.95"/>

  <ellipse cx="63" cy="54" rx="8" ry="7.5" fill="#1a1008"/>
  <ellipse cx="63" cy="54" rx="6" ry="5.5" fill="#3a2010"/>
  <circle cx="63" cy="54" r="3.2" fill="#0e0804"/>
  <circle cx="65" cy="51.5" r="1.8" fill="white" opacity="0.95"/>

  <!-- Hocico -->
  <ellipse cx="50" cy="78" rx="17" ry="12" fill="#e8c8b0" filter="url(#shadow)"/>
  <ellipse cx="44" cy="80" rx="3.8" ry="2.8" fill="#1a0e08" opacity="0.9"/>
  <ellipse cx="56" cy="80" rx="3.8" ry="2.8" fill="#1a0e08" opacity="0.9"/>

  <!-- RFID arete -->
  <circle cx="13" cy="49" r="5" fill="#00c896" opacity="0.9" filter="url(#glow)"/>
  <circle cx="13" cy="49" r="2.5" fill="#071a2f"/>
  <circle cx="13" cy="49" r="1" fill="#00f5d4" opacity="0.9"/>

  <!-- Brillo -->
  <ellipse cx="46" cy="25" rx="28" ry="13" fill="white" opacity="0.08"/>
</svg>
